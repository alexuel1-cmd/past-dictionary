<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초중등 필수 영어 동사 과거형 사전</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      margin-top: 10px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid var(--border);
      border-radius: 14px;
      outline: none;
      background-color: var(--card-bg);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    .result-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      text-align: center;
      margin-bottom: 24px;
    }

    .word-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .word-present {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .word-meaning {
      font-size: 16px;
      color: #059669;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 16px 0;
    }

    .past-box {
      background-color: #f1f5f9;
      padding: 18px;
      border-radius: 12px;
    }

    .past-box .label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .past-value-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .past-box .value {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }

    /* 음성 발음 버튼 스타일 */
    .speaker-btn {
      background: #e0e7ff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .speaker-btn:hover {
      background-color: var(--primary);
      color: white;
      transform: scale(1.1);
    }

    .speaker-btn:active {
      transform: scale(0.95);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .badge-irregular {
      background-color: #fef3c7;
      color: #d97706;
    }

    .badge-regular {
      background-color: #e0e7ff;
      color: #4338ca;
    }

    .quick-list {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .quick-list h2 {
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background-color: #f1f5f9;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag:hover {
      background-color: var(--primary);
      color: white;
    }

    .empty-state {
      color: var(--text-muted);
      padding: 20px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📘 스마트 과거형 사전</h1>
    <p>동사 현재형을 입력하면 과거형과 뜻을 알려줍니다</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="영단어 입력 (예: ride, visit, tell)" oninput="searchWord()" autofocus>
  </div>

  <div class="result-card" id="resultCard">
    <div class="empty-state">단어를 입력하거나 아래 추천 단어를 눌러보세요.</div>
  </div>

  <div class="quick-list">
    <h2>🔥 자주 찾는 동사</h2>
    <div class="tags">
      <button class="tag" onclick="quickSearch('ride')">ride</button>
      <button class="tag" onclick="quickSearch('visit')">visit</button>
      <button class="tag" onclick="quickSearch('tell')">tell</button>
      <button class="tag" onclick="quickSearch('go')">go</button>
      <button class="tag" onclick="quickSearch('see')">see</button>
      <button class="tag" onclick="quickSearch('eat')">eat</button>
      <button class="tag" onclick="quickSearch('take')">take</button>
      <button class="tag" onclick="quickSearch('write')">write</button>
      <button class="tag" onclick="quickSearch('have')">have</button>
      <button class="tag" onclick="quickSearch('make')">make</button>
    </div>
  </div>
</div>

<script>
  // 불규칙 동사 및 예외 단어 데이터베이스
  const dict = {
    "ride": ["rode", "타다"],
    "visit": ["visited", "방문하다"],
    "tell": ["told", "말하다, 이야기하다"],
    "sell": ["sold", "팔다"],
    "be": ["was / were", "~이다, 있다"],
    "is": ["was", "~이다, 있다"],
    "am": ["was", "~이다, 있다"],
    "are": ["were", "~이다, 있다"],
    "go": ["went", "가다"],
    "come": ["came", "오다"],
    "run": ["ran", "달리다"],
    "see": ["saw", "보다"],
    "eat": ["ate", "먹다"],
    "drink": ["drank", "마시다"],
    "take": ["took", "가지고 가다, 타다"],
    "make": ["made", "만들다"],
    "have": ["had", "가지고 있다, 먹다"],
    "do": ["did", "하다"],
    "say": ["said", "말하다"],
    "get": ["got", "얻다, 받다"],
    "write": ["wrote", "쓰다"],
    "read": ["read", "읽다"],
    "speak": ["spoke", "말하다"],
    "buy": ["bought", "살다"],
    "find": ["found", "찾다"],
    "think": ["thought", "생각하다"],
    "know": ["knew", "알다"],
    "give": ["gave", "주다"],
    "sing": ["sang", "노래하다"],
    "swim": ["swam", "수영하다"],
    "fly": ["flew", "날다"],
    "sleep": ["slept", "자다"],
    "feel": ["felt", "느끼다"],
    "meet": ["met", "만나다"],
    "leave": ["left", "떠나다, 남기다"],
    "bring": ["brought", "가져오다"],
    "teach": ["taught", "가르치다"],
    "catch": ["caught", "잡다"],
    "hear": ["heard", "듣다"],
    "stand": ["stood", "서다"],
    "sit": ["sat", "앉다"],
    "pay": ["paid", "지불하다"],
    "draw": ["drew", "그리다"],
    "grow": ["grew", "자라다"],
    "wear": ["wore", "입다"],
    "win": ["won", "이기다"],
    "lose": ["lost", "잃다, 지다"],
    "keep": ["kept", "유지하다"],
    "begin": ["began", "시작하다"],
    "fall": ["fell", "떨어지다"],
    "break": ["broke", "부수다"],
    "cut": ["cut", "자르다"],
    "put": ["put", "놓다"],
    "hurt": ["hurt", "다치게 하다"],
    "hit": ["hit", "치다"]
  };

  // 영어 발음 읽어주기 (TTS) 함수
  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // 이전 발음 중단
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US'; // 미국식 영어
      utterance.rate = 0.9;     // 학생들을 위해 살짝 천천히
      window.speechSynthesis.speak(utterance);
    } else {
      alert('현재 기기/브라우저에서는 음성 재생을 지원하지 않습니다.');
    }
  }

  // 규칙 변화 자동 처리 알고리즘
  function getRegularPast(verb) {
    if (verb.endsWith('e')) {
      return verb + 'd';
    } 
    else if (verb.length > 2 && verb.endsWith('y') && !'aeiou'.includes(verb[verb.length - 2])) {
      return verb.slice(0, -1) + 'ied';
    } 
    else if (verb === 'visit' || verb === 'open' || verb === 'enter') {
      return verb + 'ed';
    }
    else if (
      verb.length >= 3 &&
      !'aeiou'.includes(verb[verb.length - 1]) &&
      'aeiou'.includes(verb[verb.length - 2]) &&
      !'aeiou'.includes(verb[verb.length - 3]) &&
      !['w', 'x', 'y'].includes(verb[verb.length - 1])
    ) {
      return verb + verb[verb.length - 1] + 'ed';
    } 
    else {
      return verb + 'ed';
    }
  }

  function searchWord() {
    const input = document.getElementById('searchInput').value.toLowerCase().trim();
    const card = document.getElementById('resultCard');

    if (!input) {
      card.innerHTML = `<div class="empty-state">단어를 입력하거나 아래 추천 단어를 눌러보세요.</div>`;
      return;
    }

    let past, meaning, isIrregular = false;

    if (dict[input]) {
      [past, meaning] = dict[input];
      isIrregular = true;
    } else {
      past = getRegularPast(input);
      meaning = "규칙 동사 변환 적용됨";
    }

    const badgeHTML = isIrregular 
      ? `<span class="badge badge-irregular">불규칙 변환</span>` 
      : `<span class="badge badge-regular">규칙 변환 (-ed)</span>`;

    // was / were 처리
    const speakText = past.includes('/') ? past.split('/')[0].trim() : past;

    card.innerHTML = `
      ${badgeHTML}
      <div class="word-header">
        <span class="word-present">${input}</span>
        <button class="speaker-btn" onclick="speak('${input}')" title="현재형 발음 듣기">🔊</button>
      </div>
      <div class="word-meaning">${meaning}</div>
      <div class="divider"></div>
      <div class="past-box">
        <div class="label">과거형 (Past Tense)</div>
        <div class="past-value-wrap">
          <span class="value">${past}</span>
          <button class="speaker-btn" onclick="speak('${speakText}')" title="과거형 발음 듣기">🔊</button>
        </div>
      </div>
    `;
  }

  function quickSearch(word) {
    document.getElementById('searchInput').value = word;
    searchWord();
  }
</script>

</body>
</html>
